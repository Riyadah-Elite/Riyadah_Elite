<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" fill="none">
  <defs>
    <linearGradient id="heroSky" x1="0" y1="0" x2="1200" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0D12" />
      <stop offset="50%" stop-color="#141826" />
      <stop offset="100%" stop-color="#0E111A" />
    </linearGradient>
    <radialGradient id="violetCore" cx="55%" cy="42%" r="45%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.45" />
      <stop offset="55%" stop-color="#6D28D9" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0B0D12" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cyanGlow" cx="76%" cy="30%" r="32%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.28" />
      <stop offset="60%" stop-color="#3B82F6" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0B0D12" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="visorGrad" x1="560" y1="220" x2="680" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="armorEdge" x1="450" y1="180" x2="780" y2="660" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
  </defs>
  <rect width="1200" height="720" fill="url(#heroSky)" />
  <rect width="1200" height="720" fill="url(#violetCore)" />
  <rect width="1200" height="720" fill="url(#cyanGlow)" />

  <!-- Architectural Horizon Grid & Citadel Towers -->
  <g opacity="0.22" stroke="#8B5CF6" stroke-width="1">
    <line x1="0" y1="520" x2="1200" y2="520" />
    <line x1="0" y1="570" x2="1200" y2="570" />
    <line x1="0" y1="630" x2="1200" y2="630" />
    <line x1="200" y1="520" x2="40" y2="720" />
    <line x1="400" y1="520" x2="300" y2="720" />
    <line x1="600" y1="520" x2="600" y2="720" />
    <line x1="800" y1="520" x2="900" y2="720" />
    <line x1="1000" y1="520" x2="1160" y2="720" />
  </g>

  <!-- Distant Arena Spires -->
  <g fill="#121622" stroke="#262D40" stroke-width="1.5">
    <polygon points="110,520 110,210 165,175 195,210 195,520" />
    <polygon points="230,520 230,270 295,240 295,520" />
    <polygon points="880,520 880,190 950,145 990,190 990,520" />
    <polygon points="1025,520 1025,250 1095,220 1095,520" />
  </g>

  <!-- Glowing Arena Ring -->
  <ellipse cx="610" cy="360" rx="310" ry="310" stroke="#8B5CF6" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="12 8" />
  <ellipse cx="610" cy="360" rx="245" ry="245" stroke="#22D3EE" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Central Vanguard Operative Silhouette & Exosuit -->
  <g>
    <!-- Cape / Tactical Shroud -->
    <path d="M430 350 L350 690 L840 690 L785 350 Z" fill="#111520" stroke="#2D3548" stroke-width="2" />
    <!-- Torso Armor Plates -->
    <path d="M465 330 L610 285 L755 330 L795 540 L610 610 L425 540 Z" fill="#181D2C" stroke="url(#armorEdge)" stroke-width="3" />
    <!-- Shoulder Pauldrons -->
    <path d="M395 345 L485 300 L515 395 L410 430 Z" fill="#1F2537" stroke="#8B5CF6" stroke-width="2.5" />
    <path d="M825 345 L735 300 L705 395 L810 430 Z" fill="#1F2537" stroke="#22D3EE" stroke-width="2.5" />
    <!-- Chest Core Reactor -->
    <polygon points="610,365 655,405 610,465 565,405" fill="#8B5CF6" fill-opacity="0.25" stroke="#8B5CF6" stroke-width="2.5" />
    <polygon points="610,382 636,405 610,442 584,405" fill="#22D3EE" />
    <!-- Helmet & Tactical Visor -->
    <path d="M545 190 L610 150 L675 190 L690 275 L610 315 L530 275 Z" fill="#161A28" stroke="#8B5CF6" stroke-width="2.5" />
    <path d="M552 228 L610 246 L668 228 L656 258 L610 272 L564 258 Z" fill="url(#visorGrad)" />
  </g>

  <!-- Holographic Playtest Telemetry Nodes -->
  <g opacity="0.85">
    <line x1="668" y1="235" x2="815" y2="175" stroke="#22D3EE" stroke-width="1.5" stroke-dasharray="4 4" />
    <circle cx="815" cy="175" r="5" fill="#22D3EE" />
    <line x1="485" y1="320" x2="335" y2="255" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="4 4" />
    <circle cx="335" cy="255" r="5" fill="#8B5CF6" />
  </g>
</svg>
