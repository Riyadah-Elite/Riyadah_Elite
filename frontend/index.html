    <!-- 4. FAQPage Schema (AEO / Direct Answer Engine & Featured Snippet Optimization) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "@id": "https://riyadahelite.gg/#faq",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What is Riyadah Elite?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Riyadah Elite is an integrated gaming and playtesting ecosystem that connects gamers, verified QA playtesters, game developers, and esports organizations through game discovery, structured playtesting, reproducible bug reporting, tournaments, and dual-track player progression."
            }
          },
          {
            "@type": "Question",
            "name": "Who can join?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Any gamer, community playtester, independent or studio game developer, and esports tournament organizer can join Riyadah Elite and configure their account role."
            }
          },
          {
            "@type": "Question",
            "name": "How does game testing work?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Developers publish upcoming or live game builds with specific test objectives. Players enroll in an Open Playtest, Closed Beta, or Bug Bounty cohort, test the build on their supported platform, and submit structured feedback."
            }
          },
          {
            "@type": "Question",
            "name": "How do I report bugs?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Inside the Bug Reporting module, select the target game build, classify the issue severity (Critical, High, Medium, or Low), and fill in the structured reproduction steps, expected behavior, and actual behavior."
            }
          },
          {
            "@type": "Question",
            "name": "Can developers publish games?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Verified studios and independent developers can list game builds, define playtesting missions, triage incoming community bug reports, and coordinate launch tournaments."
            }
          },
          {
            "@type": "Question",
            "name": "How do tournaments work?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Organizations and studios schedule tournaments with transparent slot capacities, registration deadlines, prize structures, and live Single Elimination, Double Elimination, or Swiss brackets."
            }
          },
          {
            "@type": "Question",
            "name": "How are tester rankings calculated?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Tester Rankings are calculated strictly from verified QA contributions—including the severity of confirmed bug reports, reproduction accuracy rate, and completed playtest builds—kept completely separate from tournament match standings."
            }
          },
          {
            "@type": "Question",
            "name": "Is registration free?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Creating a Riyadah Elite player and playtester account, enrolling in open playtests, submitting bug reports, and entering community tournaments are free."
            }
          },
          {
            "@type": "Question",
            "name": "How can organizations join?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Esports organizations and community hosts can register an organizer profile or contact our partnership desk to host verified tournaments and scout top regional players and playtesters."
            }
          },
          {
            "@type": "Question",
            "name": "How do I contact support?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "You can reach the Riyadah Elite support and triage operations team directly through the Support Desk modal in the footer or via your authenticated NEXUS workspace notifications panel."
            }
          }
        ]
      }
    </script>
