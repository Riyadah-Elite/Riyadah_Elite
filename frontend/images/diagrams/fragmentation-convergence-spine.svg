<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" fill="none">
  <rect width="1200" height="600" fill="#0B0D12" />
  <!-- Fragmented Upper Zone Grid -->
  <g stroke="#EF4444" stroke-opacity="0.22" stroke-dasharray="6 6" stroke-width="1.5">
    <line x1="120" y1="40" x2="600" y2="300" />
    <line x1="360" y1="40" x2="600" y2="300" />
    <line x1="600" y1="40" x2="600" y2="300" />
    <line x1="840" y1="40" x2="600" y2="300" />
    <line x1="1080" y1="40" x2="600" y2="300" />
  </g>
  <!-- Unified Lower Zone Grid -->
  <g stroke="#3B82F6" stroke-opacity="0.38" stroke-width="2">
    <line x1="600" y1="300" x2="200" y2="560" />
    <line x1="600" y1="300" x2="400" y2="560" />
    <line x1="600" y1="300" x2="600" y2="560" />
    <line x1="600" y1="300" x2="800" y2="560" />
    <line x1="600" y1="300" x2="1000" y2="560" />
  </g>
  <circle cx="600" cy="300" r="42" fill="#181C26" stroke="#8B5CF6" stroke-width="3" />
  <circle cx="600" cy="300" r="16" fill="#22D3EE" />
</svg>
