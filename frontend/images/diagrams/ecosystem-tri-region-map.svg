<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" fill="none">
  <defs>
    <radialGradient id="hubGlow" cx="50%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.28" />
      <stop offset="60%" stop-color="#3B82F6" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0B0D12" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1200" height="540" rx="24" fill="#0B0D12" />
  <rect width="1200" height="540" rx="24" fill="url(#hubGlow)" />

  <!-- Perspective Horizon Grid -->
  <g stroke="#252B3B" stroke-width="1">
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="220" y1="0" x2="220" y2="540" />
    <line x1="600" y1="0" x2="600" y2="540" />
    <line x1="980" y1="0" x2="980" y2="540" />
  </g>

  <!-- Concentric Ecosystem Orbit Rings -->
  <circle cx="600" cy="250" r="190" stroke="#8B5CF6" stroke-opacity="0.32" stroke-width="1.5" stroke-dasharray="6 6" />
  <circle cx="600" cy="250" r="125" stroke="#22D3EE" stroke-opacity="0.38" stroke-width="1.5" />

  <!-- Connecting Conduits to the Three Regions -->
  <path d="M 520 220 C 410 180, 320 155, 220 155" stroke="#8B5CF6" stroke-width="3" />
  <path d="M 600 330 L 600 445" stroke="#22D3EE" stroke-width="3" />
  <path d="M 680 220 C 790 180, 880 155, 980 155" stroke="#3B82F6" stroke-width="3" />

  <!-- Region 01 Node: Gamers & Playtesters -->
  <g>
    <rect x="90" y="95" width="260" height="120" rx="16" fill="#181C26" stroke="#8B5CF6" stroke-width="2" />
    <circle cx="135" cy="155" r="22" fill="#8B5CF6" fill-opacity="0.25" stroke="#8B5CF6" stroke-width="2" />
    <circle cx="135" cy="155" r="8" fill="#A78BFA" />
    <text x="172" y="145" fill="#A78BFA" font-family="monospace" font-size="11" font-weight="bold">REGION 01 · PLAYERS</text>
    <text x="172" y="168" fill="#F8FAFC" font-family="sans-serif" font-size="15" font-weight="bold">Gamers &amp; Playtesters</text>
    <text x="172" y="188" fill="#94A3B8" font-family="monospace" font-size="11">Builds · Bounties · Ranks</text>
  </g>

  <!-- Region 02 Node: Game Developers & Studios -->
  <g>
    <rect x="460" y="395" width="280" height="115" rx="16" fill="#181C26" stroke="#22D3EE" stroke-width="2" />
    <rect x="492" y="432" width="40" height="40" rx="10" fill="#22D3EE" fill-opacity="0.22" stroke="#22D3EE" stroke-width="2" />
    <text x="548" y="438" fill="#22D3EE" font-family="monospace" font-size="11" font-weight="bold">REGION 02 · STUDIOS</text>
    <text x="548" y="460" fill="#F8FAFC" font-family="sans-serif" font-size="15" font-weight="bold">Developers &amp; QA Teams</text>
    <text x="548" y="480" fill="#94A3B8" font-family="monospace" font-size="11">Cohorts · Triage · Telemetry</text>
  </g>

  <!-- Region 03 Node: Esports Organizations -->
  <g>
    <rect x="850" y="95" width="260" height="120" rx="16" fill="#181C26" stroke="#3B82F6" stroke-width="2" />
    <polygon points="895,132 917,172 873,172" fill="#3B82F6" fill-opacity="0.25" stroke="#3B82F6" stroke-width="2" />
    <text x="932" y="145" fill="#3B82F6" font-family="monospace" font-size="11" font-weight="bold">REGION 03 · ORGANIZERS</text>
    <text x="932" y="168" fill="#F8FAFC" font-family="sans-serif" font-size="15" font-weight="bold">Esports Organizations</text>
    <text x="932" y="188" fill="#94A3B8" font-family="monospace" font-size="11">Brackets · Prize Pools · Talent</text>
  </g>

  <!-- Central NEXUS Core Hub -->
  <g>
    <circle cx="600" cy="250" r="64" fill="#181C26" stroke="#8B5CF6" stroke-width="3" />
    <circle cx="600" cy="250" r="46" fill="#8B5CF6" fill-opacity="0.22" stroke="#22D3EE" stroke-width="1.5" />
    <text x="600" y="246" text-anchor="middle" fill="#F8FAFC" font-family="sans-serif" font-size="14" font-weight="bold">RIYADAH ELITE</text>
    <text x="600" y="264" text-anchor="middle" fill="#22D3EE" font-family="monospace" font-size="11" font-weight="bold">ECOSYSTEM CORE</text>
  </g>
</svg>
