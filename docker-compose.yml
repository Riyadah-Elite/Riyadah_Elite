version: "3.8"

services:
  # ==========================================
  # MinIO: S3-Compatible Object Storage
  # ==========================================
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: riyadah-minio
    restart: unless-stopped
    ports:
      - "9000:9000" # MinIO S3 API
      - "9001:9001" # MinIO Web Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Auto-provision initial storage bucket
  minio-init:
    image: minio/mc:latest
    container_name: riyadah-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/riyadah-media || true;
      /usr/bin/mc anonymous set download myminio/riyadah-media;
      exit 0;
      "

  # ==========================================
  # Redis: In-Memory Caching & Session Layer
  # ==========================================
  redis:
    image: redis:7.2-alpine
    container_name: riyadah-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ==========================================
  # RabbitMQ: Asynchronous Event/Job Broker
  # ==========================================
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: riyadah-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"   # AMQP protocol
      - "15672:15672" # Management Web UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  minio_data:
  redis_data:
  rabbitmq_data:
